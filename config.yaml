  # Verified live 2026-10-01. The previous llama-3.3-70b / gemini-2.0-flash
  # entries were both retired upstream and every scoring call was failing.
  providers:
  - name: groq
    model: groq/openai/gpt-oss-120b
    env_keys:
    - GROQ_API_KEY
    - GROQ_API_KEY_2
    - GROQ_API_KEY_3
  - name: gemini
    model: gemini/gemini-3.8-flash
    env_keys:
