name: AutoAppy Daily Pipeline

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Pipeline mode
        required: false
        default: discover-then-score
        type: choice
        options:
          - discover-then-score
          - discover-only
          - score-only

jobs:

  # Stage 1: Discover (own 40-min budget - all sources run in parallel)
  discover:
    name: Stage 1 - Discovery (all sources)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.event.inputs.mode != 'score-only'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - name: Install dependencies
        run: pip install -r requirements-cloud.txt

      - name: Prepare directories
        run: mkdir -p data outputs/resumes outputs/cover_letters logs

      - name: Run discovery (all sources)
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: python run.py --discover-only

      - name: Commit DB after discovery
        if: always()
        run: |
          git config --global user.name AutoAppy-Bot
          git config --global user.email autoapply-bot@github-actions
          git add data/autoapply.db || true
          if git diff --staged --quiet; then
            echo "No DB changes to commit"
          else
            git commit -m "chore: discovery $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi

  # Stage 2: Score (own 40-min budget)
  score:
    name: Stage 2 - LLM Scoring
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [discover]
    if: always() && (needs.discover.result == 'success' || needs.discover.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - name: Install dependencies
        run: pip install -r requirements-cloud.txt

      - name: Pull latest DB from discovery job
        run: |
          git pull --rebase origin main || true
          mkdir -p data outputs/resumes outputs/cover_letters logs

      - name: Run scoring
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python run.py --score-only

      - name: Export CSV summary
        if: always()
        run: python scripts/export_csv.py

      - name: Commit DB and CSV
        if: always()
        run: |
          git config --global user.name AutoAppy-Bot
          git config --global user.email autoapply-bot@github-actions
          git add data/autoapply.db outputs/latest_jobs.csv || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: scoring $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoapply-run-${{ github.run_number }}
          path: |
            outputs/latest_jobs.csv
            logs/
          retention-days: 7
