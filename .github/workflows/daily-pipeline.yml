name: AutoAppy Daily Pipeline

on:
  schedule:
    # Runs daily at 3:30 AM UTC = 9:00 AM IST
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pipeline mode'
        required: false
        default: 'score-only'
        type: choice
        options:
          - discover-only
          - score-only

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ── 1. Checkout repo (includes committed DB) ──────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      # ── 2. Set up Python ─────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-cloud.txt

      # ── 3. Install cloud-only dependencies ───────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements-cloud.txt

      # ── 4. Restore DB from previous run ──────────────────────────────────
      - name: Restore database
        run: |
          mkdir -p data outputs/resumes outputs/cover_letters logs
          if [ -f data/autoapply.db ]; then
            echo "✅ Database found from previous run ($(du -sh data/autoapply.db | cut -f1))"
          else
            echo "🆕 No existing database — fresh start"
          fi

      # ── 5. Run pipeline ───────────────────────────────────────────────────
      - name: Run AutoAppy pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MODE="${{ github.event.inputs.mode || 'score-only' }}"
          echo "🚀 Running in mode: $MODE"

          if [ "$MODE" = "discover-only" ]; then
            python run.py --discover-only
          else
            python run.py --score-only
          fi

      # ── 6. Export scored jobs summary as CSV (for easy viewing) ──────────
      - name: Export jobs summary
        if: always()
        run: |
          python - <<'EOF'
          import sqlite3, csv, os
          from pathlib import Path

          db_path = "data/autoapply.db"
          if not Path(db_path).exists():
              print("No DB found — skipping export")
              exit(0)

          conn = sqlite3.connect(db_path)
          cur = conn.cursor()

          # Export top scored jobs from last 7 days
          cur.execute("""
              SELECT title, company, location, match_score, status,
                     tfidf_score, score_reasoning, job_url, discovered_at
              FROM jobs
              WHERE discovered_at >= datetime('now', '-7 days')
              ORDER BY match_score DESC NULLS LAST, discovered_at DESC
              LIMIT 100
          """)
          rows = cur.fetchall()
          headers = ["title", "company", "location", "score", "status",
                     "tfidf_score", "reasoning", "url", "discovered_at"]

          Path("outputs").mkdir(exist_ok=True)
          with open("outputs/latest_jobs.csv", "w", newline="") as f:
              writer = csv.writer(f)
              writer.writerow(headers)
              writer.writerows(rows)

          print(f"✅ Exported {len(rows)} jobs to outputs/latest_jobs.csv")

          # Print quick summary
          cur.execute("SELECT status, COUNT(*) FROM jobs GROUP BY status ORDER BY COUNT(*) DESC")
          print("\n📊 DB Summary:")
          for status, count in cur.fetchall():
              print(f"  {status}: {count}")
          conn.close()
          EOF

      # ── 7. Commit updated DB and CSV back to repo ─────────────────────────
      - name: Commit updated database
        if: always()
        run: |
          git config --global user.name "AutoAppy Bot"
          git config --global user.email "autoapply-bot@github-actions"

          git add data/autoapply.db outputs/latest_jobs.csv || true

          # Only commit if there are actual changes
          if git diff --staged --quiet; then
            echo "No changes to commit — DB unchanged"
          else
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "chore: AutoAppy pipeline run — $TIMESTAMP [skip ci]"
            git push
            echo "✅ Database committed and pushed"
          fi

      # ── 8. Upload artifacts (backup, always available in Actions UI) ──────
      - name: Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoapply-run-${{ github.run_number }}
          path: |
            outputs/latest_jobs.csv
            logs/
          retention-days: 7
