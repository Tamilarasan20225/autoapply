name: AutoAppy Daily Pipeline

on:
  schedule:
    # Runs daily at 03:30 UTC (09:00 IST) — ONLY when scheduler.enabled=true in config.yaml
    # To disable daily runs: set scheduler.enabled: false in config.yaml OR disable this workflow
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pipeline mode'
        required: false
        default: 'discover-then-score'
        type: choice
        options:
          - discover-then-score
          - discover-only
          - score-only
          - refresh

jobs:

  # ── Check if scheduler is enabled ──────────────────────────────────────────
  check-schedule:
    name: Check schedule enabled
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check scheduler.enabled in config.yaml
        id: check
        run: |
          # For manual workflow_dispatch: always run
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "✅ Manual trigger — running regardless of scheduler.enabled"
            exit 0
          fi
          # For scheduled runs: check config.yaml
          ENABLED=$(python3 -c "
          import yaml
          with open('config.yaml') as f:
              cfg = yaml.safe_load(f)
          print(str(cfg.get('scheduler', {}).get('enabled', False)).lower())
          " 2>/dev/null || echo "false")
          echo "should_run=$ENABLED" >> $GITHUB_OUTPUT
          if [ "$ENABLED" = "true" ]; then
            echo "✅ scheduler.enabled=true — proceeding with daily run"
          else
            echo "⏸️ scheduler.enabled=false — skipping daily run"
          fi

  # ── Stage 1: Discover ──────────────────────────────────────────────────────
  discover:
    name: Stage 1 — Discovery (all sources)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: check-schedule
    if: >
      needs.check-schedule.outputs.should_run == 'true' &&
      github.event.inputs.mode != 'score-only'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - name: Install dependencies
        run: pip install -r requirements-cloud.txt

      - name: Prepare directories
        run: mkdir -p data outputs/resumes outputs/cover_letters logs

      - name: Backfill resume profiles (safe no-op if already done)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python run.py --backfill-profiles || true

      - name: Run discovery (all sources, all user roles merged)
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
        run: python run.py --discover-only

      - name: Commit DB after discovery
        if: always()
        run: |
          git config --global user.name AutoAppy-Bot
          git config --global user.email autoapply-bot@github-actions
          git add data/autoapply.db data/ats_slug_cache.json || true
          if git diff --staged --quiet; then
            echo "No DB changes to commit"
          else
            git commit -m "chore: discovery $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi

  # ── Stage 2: Score all users ───────────────────────────────────────────────
  score:
    name: Stage 2 — LLM Scoring (all users)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    needs: [check-schedule, discover]
    if: >
      needs.check-schedule.outputs.should_run == 'true' &&
      always() &&
      (needs.discover.result == 'success' || needs.discover.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - name: Install dependencies
        run: pip install -r requirements-cloud.txt

      - name: Pull latest DB from discovery job
        run: |
          git pull --rebase origin main || true
          mkdir -p data outputs/resumes outputs/cover_letters logs

      - name: Run scoring (Tamil + profiles with schedule_enabled=True)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Tells run.py this is a scheduled run → respect per-profile schedule_enabled flag
          AUTOAPPLY_SCHEDULED_RUN: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "$MODE" = "refresh" ]; then
            python run.py --refresh
          else
            python run.py --score-only
          fi

      - name: Export CSV summary
        if: always()
        run: python scripts/export_csv.py || true

      - name: Commit DB and CSV
        if: always()
        run: |
          git config --global user.name AutoAppy-Bot
          git config --global user.email autoapply-bot@github-actions
          git add data/autoapply.db outputs/latest_jobs.csv || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: scoring $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoapply-run-${{ github.run_number }}
          path: |
            outputs/latest_jobs.csv
            logs/
          retention-days: 7
